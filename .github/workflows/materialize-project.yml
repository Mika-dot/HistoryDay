name: Materialize Android project

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'agent/vibe-camera'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vibe-camera
          fetch-depth: 0
      - name: Expand project archive
        shell: bash
        run: |
          test -f project.part.06 || exit 1
          cat project.part.* | base64 -d > /tmp/historyday.zip
          rm -f project.part.*
          unzip -o /tmp/historyday.zip -d .
          rm -f .github/workflows/materialize-project.yml
      - name: Commit source tree
        shell: bash
        run: |
          test -f app/build.gradle.kts || exit 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Redesign app and add selfie-first capture"
          git push origin HEAD:agent/vibe-camera
