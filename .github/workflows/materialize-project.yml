name: Materialize Android project

on:
  push:
    branches: [agent/vibe-camera]
    paths:
      - project.zip.b64
      - .github/workflows/materialize-project.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vibe-camera
          fetch-depth: 0
      - name: Expand project archive
        shell: bash
        run: |
          if [ ! -f project.zip.b64 ]; then
            echo "Archive not uploaded yet"
            exit 0
          fi
          base64 -d project.zip.b64 > /tmp/historyday.zip
          rm -f project.zip.b64
          unzip -o /tmp/historyday.zip -d .
          rm -f .github/workflows/materialize-project.yml
      - name: Commit source tree
        shell: bash
        run: |
          if [ ! -f app/build.gradle.kts ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Redesign app and add selfie-first capture"
          git push origin HEAD:agent/vibe-camera
